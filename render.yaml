# Render Infrastructure-as-Code Configuration for GeoFusion AI
services:
  - type: web
    name: geofusion-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/app.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
